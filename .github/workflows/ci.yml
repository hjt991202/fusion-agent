name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,ui,agent]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: node --check web/app.mjs && node --check web/fusion.mjs
      - run: python -m fusion_agent.cli --visible examples/visible.png --infrared examples/infrared.png --output outputs/ci
