name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,ui,agent]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: node --check web/app.mjs && node --check web/fusion.mjs && node --check web/showcase.mjs
      - run: python -m fusion_agent.cli --visible examples/visible.png --infrared examples/infrared.png --output outputs/ci
  research-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,research]'
      - run: pytest -q tests/test_icig.py tests/test_letters.py tests/test_prcv.py tests/test_research_workflow.py
